# 把这个文件的内容覆盖到仓库的 .github/workflows/run.yml
#
# 改动点：
# 1. workflow_dispatch 增加 user / pwd / steps 三个输入
# 2. 带输入时用 USER/PWD 环境变量（main.py 原生支持），不再读 CONFIG
# 3. 带输入时按当前时间反算 MIN/MAX_STEP，保证最终刷的就是用户填的步数
# 4. 只有定时任务才提交 encrypted_tokens.data，用户提交不走持久化

name: 刷步数

on:
  schedule:
    - cron: '31 10,12,14 * * *'
  workflow_dispatch:
    inputs:
      user:
        description: 'Zepp 账号（留空则用仓库 CONFIG）'
        required: false
        default: ''
      pwd:
        description: 'Zepp 密码（留空则用仓库 CONFIG）'
        required: false
        default: ''
      steps:
        description: '目标步数（留空则按 CONFIG 的 MIN/MAX 随机）'
        required: false
        default: ''

# 同一时间只跑一个，避免多个任务同时登录 Zepp 触发风控
concurrency:
  group: mimotion
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout codes
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}

      - name: 初始化Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      # main.py 会按当前时间比例缩放步数，这里反向换算，
      # 保证最终刷的就是用户填的值。只用户提交且填了步数时才执行。
      - name: 计算目标步数
        if: github.event.inputs.user != '' && github.event.inputs.pwd != '' && github.event.inputs.steps != ''
        env:
          IN_STEPS: ${{ github.event.inputs.steps }}
        run: |
          H=$(TZ=Asia/Shanghai date +%H)
          M=$(TZ=Asia/Shanghai date +%M)
          RATE=$(awk -v h="$H" -v m="$M" 'BEGIN{r=(h*60+m)/1320; if(r>1)r=1; if(r<0.02)r=0.02; printf "%.6f", r}')
          VAL=$(awk -v s="$IN_STEPS" -v r="$RATE" 'BEGIN{v=int(s/r+0.5); if(v<1)v=1; print v}')
          {
            echo "MIN_STEP=$VAL"
            echo "MAX_STEP=$VAL"
          } >> "$GITHUB_ENV"

      - name: 开始
        env:
          CONFIG: ${{ secrets.CONFIG }}
          AES_KEY: ${{ secrets.AES_KEY }}
          IN_USER: ${{ github.event.inputs.user }}
          IN_PWD: ${{ github.event.inputs.pwd }}
        run: |
          pip3 install -r requirements.txt

          if [ -n "$IN_USER" ] && [ -n "$IN_PWD" ]; then
            # 用户提交：不使用仓库里的 CONFIG / 不持久化 token
            echo "::add-mask::$IN_PWD"
            unset CONFIG
            unset AES_KEY
            export USER="$IN_USER"
            export PWD="$IN_PWD"
          fi

          python3 main.py

      - name: persist tokens
        if: github.event_name == 'schedule'
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -A
          git diff --cached --quiet || git commit -m "persist tokens trigger by schedule"
          git push origin master
